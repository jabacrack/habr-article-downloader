<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сохранить в Joplin</title>
  <link rel="stylesheet" href="styles/joplin.css">
</head>
<body>
  <main>
    <p class="eyebrow">HABR → JOPLIN</p>
    <h1>Сохранить статью</h1>
    <section aria-label="Подключение">
      <p>Запустите Joplin Desktop и включите службу Web Clipper в его настройках.</p>
      <button id="connect" type="button">Подключить Joplin</button>
      <p id="connectionStatus" role="status" aria-live="polite"></p>
    </section>
    <form id="noteForm" hidden>
      <label for="title">Заголовок</label>
      <input id="title" name="title" required disabled>
      <label for="folder">Блокнот</label>
      <div class="folder-row">
        <select id="folder" name="folder" required disabled><option value="">Загрузка…</option></select>
        <button id="refresh" type="button" disabled aria-label="Обновить блокноты">Обновить</button>
      </div>
      <label class="comments-option" for="includeComments"><input id="includeComments" type="checkbox"> Сохранять комментарии</label>
      <p class="help">Последний выбранный блокнот запоминается. Картинки сохраняются как ссылки на оригиналы.</p>
      <a id="source" target="_blank" rel="noopener noreferrer">Открыть статью на Habr</a>
      <div class="actions">
        <button id="save" class="primary" type="submit" disabled>Сохранить в Joplin</button>
        <button id="close" type="button">Закрыть</button>
        <button id="setup" type="button" hidden>Подключить</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="joplin.js"></script>
</body>
</html>
